name: Synchronize Flutter QR dependency lock
on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
      - .github/workflows/sync-flutter-lock.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve and update dependency lock
        run: flutter pub get
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: lock Flutter SVG QR renderer dependencies"
          git push
