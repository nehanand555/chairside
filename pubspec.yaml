name: chairside
description: spicyself — discover local style professionals and book services.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.3
  google_maps_flutter: 2.19.0
  flutter_svg: ^2.2.1
  geolocator: 14.1.1
  url_launcher: 6.3.3
  image_picker: 1.2.4
  intl: 0.20.3
  timezone: 0.10.1
  qr_flutter: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/scissors.png

