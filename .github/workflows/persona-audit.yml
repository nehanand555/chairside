name: SpicySelf persona UX audit

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/persona-audit.yml'
  workflow_dispatch:

jobs:
  persona-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Install dependencies
        run: flutter pub get
      - name: Run role and layout journeys
        run: flutter test --reporter expanded test/agent_audit_test.dart test/product_test.dart test/redesign_test.dart
