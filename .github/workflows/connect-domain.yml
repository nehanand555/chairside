name: Connect SpicySelf domain
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-domain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connect-domain:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Connect spicyself.com to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get('CLOUDFLARE_API_TOKEN')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID')
          project = os.environ.get('CLOUDFLARE_PAGES_PROJECT')
          if not (token and account and project):
              raise SystemExit('Missing Cloudflare staging credentials or Pages project configuration')
          if project != 'chairside-staging':
              raise SystemExit('Unexpected Pages project. Refusing to change a different project.')

          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/domains'
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          def call(method, data=None):
              req = urllib.request.Request(
                  url, headers=headers, method=method,
                  data=json.dumps(data).encode('utf-8') if data is not None else None)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8')[:1200]
                  raise SystemExit(f'Cloudflare domain request returned HTTP {error.code}: {detail}') from None
              if not result.get('success'):
                  raise SystemExit('Cloudflare domain request failed: ' + str(result.get('errors')))
              return result

          existing = call('GET').get('result') or []
          domain = next((item for item in existing if item.get('name') == 'spicyself.com'), None)
          if domain is None:
              domain = call('POST', {'name': 'spicyself.com'}).get('result') or {}
              print('Attached spicyself.com to the SpicySelf Pages project.')
          else:
              print('spicyself.com is already attached to the SpicySelf Pages project.')
          print('Domain status:', domain.get('status', 'pending validation'))
          if domain.get('status') != 'active':
              print('Cloudflare may still require DNS zone activation or nameserver updates before the domain goes live.')
          PY
