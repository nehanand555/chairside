name: SpicySelf persona UX audit

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/persona-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persona-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format and commit with resolved dependencies
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib test
            git commit -m 'style: normalize Dart formatting after dependency resolution'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Verify formatting matches product CI
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Run role and layout journeys
        run: flutter test --reporter expanded test/agent_audit_test.dart test/product_test.dart test/redesign_test.dart
