name: SpicySelf persona UX audit

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/persona-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persona-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply Dart formatter on QA branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style: format QA suite"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Run role and layout journeys
        run: flutter test --reporter expanded test/agent_audit_test.dart test/product_test.dart test/redesign_test.dart
