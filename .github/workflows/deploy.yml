name: Deploy configured services
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [backend, web]
        default: web
        required: true
        description: Service to deploy after configuration
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'staging' || inputs.environment }}-${{ github.event_name == 'push' && 'web' || inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        if: inputs.target == 'backend'
        with:
          version: latest
      - name: Deploy database and functions
        if: inputs.target == 'backend'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
          supabase functions deploy --project-ref "$PROJECT_REF"
      - name: Validate web configuration and Cloudflare deployment ownership
        if: github.event_name == 'push' || inputs.target == 'web'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_MAPS_WEB_KEY: ${{ vars.GOOGLE_MAPS_WEB_KEY }}
          APPLE_SIGN_IN_ENABLED: ${{ vars.APPLE_SIGN_IN_ENABLED }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
        run: python3 tool/check_pages_deployment.py
      - uses: subosito/flutter-action@v2
        if: github.event_name == 'push' || inputs.target == 'web'
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build configured web application
        if: github.event_name == 'push' || inputs.target == 'web'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_MAPS_WEB_KEY: ${{ vars.GOOGLE_MAPS_WEB_KEY }}
          APPLE_SIGN_IN_ENABLED: ${{ vars.APPLE_SIGN_IN_ENABLED }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPPORT_EMAIL"
          test -n "$GOOGLE_MAPS_WEB_KEY"
          python3 tool/bootstrap.py --platform=web
          flutter pub get --enforce-lockfile
          flutter build web --release --dart-define-from-file=build-config.json --output=build/web
          cp tool/pages_worker.mjs build/web/_worker.js
          python3 -c 'import json,os,pathlib; pathlib.Path("build/web/version.json").write_text(json.dumps({"commit":os.environ["GITHUB_SHA"]})+"\n")'
      - uses: cloudflare/wrangler-action@v3
        if: github.event_name == 'push' || inputs.target == 'web'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
