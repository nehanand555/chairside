name: Format QA branch
on:
  push:
    branches:
      - test/full-role-ux-audit-20261026
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/full-role-ux-audit-20261026
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format lib test
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style: format QA suite"
            git push origin HEAD:test/full-role-ux-audit-20261026
          fi
